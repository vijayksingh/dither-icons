<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Outline material review</title><style>
*{box-sizing:border-box}body{margin:0;background:#151518;color:#eee;font:14px system-ui}header{position:sticky;top:0;z-index:1;background:#151518;padding:18px;border-bottom:1px solid #444}label{margin-right:18px}input,select,button{background:#28282d;color:inherit;border:1px solid #555;border-radius:6px;padding:7px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px}.card{border:1px solid #333;background:#1e1e23;border-radius:10px;padding:16px}.pair{display:flex;justify-content:space-around;align-items:center;min-height:150px}.pair>div{text-align:center}.pair p{color:#999}.di-trigger{border:0;padding:12px;background:transparent;color:#c7b5fa}body.light{background:#fff;color:#151518}body.light header{background:#fff}body.light .card{background:#f3f3f5}body.light .di-trigger{background:transparent;color:#4a2992}body.light input,body.light select,body.light button{color:#151518;background:#eee}@media(max-width:700px){main{grid-template-columns:repeat(2,minmax(0,1fr))}.pair{min-height:120px}header label{display:inline-block;margin-bottom:5px}}@media(max-width:450px){main{grid-template-columns:1fr}}</style>
<header><strong>Outline correction · 33 icons</strong><p>Before left · current material right. Focus or click any current icon to replay.</p><label>Material <select id="material" aria-label="Material"><option>outline</option><option>solid</option><option>dither</option></select></label><label>Size <select id="size" aria-label="Size"><option>96</option><option>24</option><option>32</option><option>48</option></select></label><label>Frame <select id="frame" aria-label="Frame"><option value="play">Playback</option><option value="0">0%</option><option value="0.1">10%</option><option value="0.35">35%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></label><label><input id="motion" aria-label="Motion" type="checkbox" checked> Motion</label><button id="theme">Light background</button></header><main id="root"></main>
<script type="module" src="./review.tsx"></script></html>
